# ~/.tmux.conf

# Plugins (keep your existing)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

# Force status bar to use theme
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-position top  # or bottom

# Mouse support
set -g mouse on

# Configure message line to act as a gap
set -g message-style "bg=default,fg=default"
set -g message-command-style "bg=default,fg=default"

# Keep message line always visible (acts as gap)
set -g display-panes-colour default
set -g display-panes-active-colour default

# Set message line height
set -g message-limit 1
# Ensure theme is applied
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

# Initialize TPM (MUST BE AT THE BOTTOM)
run '~/.config/tmux/plugins/tpm/tpm'
